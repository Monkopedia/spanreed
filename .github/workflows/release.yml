name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Verify tag matches pyproject and plugin versions
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$tag" != "$pkg" ]; then
            echo "Tag $GITHUB_REF_NAME does not match pyproject version $pkg"
            exit 1
          fi
          plugin=$(uv run python -c "import json; print(json.load(open('plugins/spanreed/.claude-plugin/plugin.json'))['version'])")
          if [ "$tag" != "$plugin" ]; then
            echo "Tag $GITHUB_REF_NAME does not match plugin.json version $plugin (Claude /plugin update keys off this)"
            exit 1
          fi

      - name: Build
        run: uv build

      - name: Publish to PyPI
        run: uv publish --trusted-publishing always
