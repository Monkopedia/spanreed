[project]
name = "spanreed-bus"
version = "0.0.2"
description = "Inter-agent message bus for local Claude Code sessions"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Jason Monk", email = "monkopedia@gmail.com" }]
keywords = ["claude-code", "mcp", "agent", "bus", "ipc"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "mcp>=1.0",
    "pydantic>=2.0",
    "anyio>=4.0",
]

[project.scripts]
spanreed = "spanreed.cli:main"
spanreed-mcp = "spanreed.mcp_server:main"

[project.urls]
Repository = "https://github.com/Monkopedia/spanreed"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spanreed"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pyright>=1.1.380",
    "ruff>=0.7",
    "pre-commit>=4.0",
]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "F", "W",        # pycodestyle, pyflakes
    "I",                  # isort
    "UP",                 # pyupgrade
    "B",                  # flake8-bugbear
    "SIM",                # flake8-simplify
    "RUF",                # ruff-specific
]
ignore = [
    "E501",  # line length (ruff format handles this)
]

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers --strict-config"
